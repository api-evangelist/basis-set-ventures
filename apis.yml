name: Basis Set Ventures
description: >-
  Basis Set Ventures is an AI-native, early-stage venture capital firm founded in
  2017 by Dr. Lan Xuezhao and headquartered in the San Francisco Bay Area. The firm
  invests at the seed and early stages in founders building artificial intelligence
  across AI infrastructure, autonomous systems, molecular and materials discovery,
  agentic development tooling, intelligent collaboration, and automated workflows.
  Basis Set announced a $250M Fund IV and describes itself as "the first capital
  when it's just you and your vision," pairing capital with an operator-led founder
  concierge team. Portfolio companies include Path Robotics, Quince, Sakana AI,
  Tigris Data, Mem0, OpenArt, Cusp, Simular, Vizcom, and Entire. This is an API
  Evangelist network profile of the firm; Basis Set Ventures does not publish a
  public API, developer portal, or SDKs, so this record captures firm identity,
  web properties, and derived security posture rather than API artifacts.
